# Every check this project already runs by hand, run on every push.
#
# The point is not that the checks are new — they are the same commands the README
# documents — but that "it passes on my laptop" stops being the evidence. Two of the
# four defects fixed in ADR-049..052 were caught by an outsider running the engine,
# which is exactly what CI is: an outsider with no context and no muscle memory.
#
# Deliberately not here: a coverage threshold. cli.py sat at 0% while core logic was at
# 95-100%, so a single repo-wide percentage would have been passed by the wrong work.
# Coverage is reported, not gated (see `coverage` below).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. The interesting run is always the
# newest one, and a queue of stale runs is how a red build gets ignored.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow needs to read the repo and nothing else. Stated rather than inherited,
# because the default token is broader than any job here has cause to be.
permissions:
  contents: read

jobs:
  engine:
    name: engine — pytest, ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    # No secrets are set for this job, deliberately. The explanation stage falls back to
    # its deterministic template without an API key, and `tests/conftest.py` disables it
    # for every test regardless — a suite that reaches a third-party endpoint is a suite
    # whose red builds have to be diagnosed before they can be trusted.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install dependencies
        # --frozen: install exactly what uv.lock pins and fail if the lock is stale.
        # A CI run that silently resolves different versions from the developer's is
        # testing something nobody has on their machine.
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check finctl/ tests/ ../api/

      - name: Format check
        # Non-blocking for now: 41 files would reformat, and a reformat commit that
        # large would bury the history this project keeps deliberately readable. The
        # check runs so the number is visible and shrinking rather than unknown.
        continue-on-error: true
        run: uv run ruff format --check finctl/ tests/ ../api/

      - name: Tests
        run: uv run pytest -q

      - name: Coverage
        # Reported, never gated. The honest reading is per-module: the classifier,
        # correlator, matcher, gap and ranker sit at 95-100%, and the repo-wide figure
        # is dragged down by the CLI's presentation code.
        run: |
          uv run pytest -q --cov=finctl --cov-report=term-missing:skip-covered \
            | tail -40

  metrics:
    name: engine — the accuracy matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    # The headline claim, re-derived on every push rather than trusted from a committed
    # JSON file. 0 defects missed, 0 false positives, and the balance identity holding
    # in all 26 runs is the whole argument of this project; a number that is only ever
    # regenerated by hand is a number that can quietly stop being true.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - run: uv sync --frozen --all-extras

      - name: Run the matrix
        # `shell: bash` rather than the default, because the default is `bash -e` with
        # no pipefail: the exit status of `cmd | tee` is tee's, which is 0 even when cmd
        # crashed. That is not hypothetical — `finctl matrix` died on import for six
        # commits while this step stayed green, and only the grep below noticed. A step
        # that pipes must set pipefail or it is not checking the thing it appears to.
        shell: bash
        run: |
          set -o pipefail
          uv run finctl matrix | tee /tmp/matrix.txt

      - name: The claim must hold
        # Asserted here rather than left to a human reading the log. The matrix prints
        # its own summary; this fails the build if that summary ever stops saying zero.
        run: |
          grep -q "defects missed:  0"  /tmp/matrix.txt || { echo "::error::defects were missed"; exit 1; }
          grep -q "false positives: 0"  /tmp/matrix.txt || { echo "::error::false positives"; exit 1; }
          grep -q "balance identity: holds in every run" /tmp/matrix.txt \
            || { echo "::error::the balance identity failed"; exit 1; }

      - name: Committed metrics must match the run
        # docs/matrix-results.json is committed and quoted in METRICS.md and the README.
        # If a change moves the numbers, the docs must move with it in the same commit.
        #
        # Timing fields are excluded, and that exclusion is the whole design of this
        # check: `seconds` and `rows_per_second` differ on every run because they measure
        # the machine, not the engine. A byte-for-byte diff would fail on a slow CI
        # runner, and a check that cries wolf on hardware noise is one people learn to
        # re-run until it passes — which is worse than not having it, because then a real
        # accuracy regression looks like the usual flake.
        run: |
          uv run python - <<'PY'
          import json, subprocess, sys

          VOLATILE = {"seconds", "rows_per_second"}

          def stable(path_or_text, *, from_git):
              raw = (
                  subprocess.run(
                      ["git", "show", f"HEAD:docs/matrix-results.json"],
                      capture_output=True, text=True, check=True, cwd="..",
                  ).stdout
                  if from_git
                  else open(path_or_text).read()
              )
              data = json.loads(raw)
              runs = data["runs"] if isinstance(data, dict) and "runs" in data else data
              return [
                  {k: v for k, v in run.items() if k not in VOLATILE}
                  for run in runs
              ]

          committed = stable(None, from_git=True)
          fresh = stable("../docs/matrix-results.json", from_git=False)

          if committed != fresh:
              print("::error::the matrix produced different results than docs/matrix-results.json records.")
              print("Run 'uv run finctl matrix' and commit the result.")
              for i, (a, b) in enumerate(zip(committed, fresh)):
                  if a != b:
                      changed = {k for k in a.keys() | b.keys() if a.get(k) != b.get(k)}
                      print(f"  run {i}: {sorted(changed)}")
                      print(f"    committed: { {k: a.get(k) for k in sorted(changed)} }")
                      print(f"    fresh:     { {k: b.get(k) for k in sorted(changed)} }")
              if len(committed) != len(fresh):
                  print(f"  run count: committed {len(committed)}, fresh {len(fresh)}")
              sys.exit(1)

          print(f"{len(fresh)} runs match the committed metrics (timing fields excluded)")
          PY

  web:
    name: web — types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs the lockfile exactly and fails
        # if package.json and the lock disagree, which is the same argument as --frozen.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  secrets:
    name: no secrets in the diff
    runs-on: ubuntu-latest

    # The rule that predates any code in this repo is that .env is never committed.
    # A rule with no enforcement is a convention, and this one is worth more than that:
    # the repo carries a live Razorpay key and an inference key in local .env files.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse committed credentials
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must never be committed."
            exit 1
          fi
          # Key SHAPES, not a generic entropy scan: a false positive here trains people
          # to ignore the job. .env.example is excluded because placeholders live there
          # by design.
          if git grep -nIE '(gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|rzp_live_[A-Za-z0-9]{10,})' \
               -- . ':(exclude).env.example' ':(exclude).github/workflows/*'; then
            echo "::error::what looks like a live API key is committed"
            exit 1
          fi
          echo "no credentials found in the tree"
