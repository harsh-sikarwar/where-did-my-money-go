# Tolerances — how much difference is "the same", and how late is "late".
#
# Every threshold in the engine lives here. A magic number in classifier code is a
# bug, because test day varies these deliberately (T+1 / T+2 / T+7).

# Settlement timing. Standard is T+2 working days from capture; merchants with strong
# history and low chargeback rates get T+1; international runs longer.
settlement:
  cycle_days: 2                  # the T+N in T+2
  count_working_days_only: true  # weekends do not count toward the cycle
  # How many days past the expected settlement date before "late" becomes "missing".
  # Below this, a gap is TIMING (benign, resolves itself). Above it, the money is
  # genuinely absent and needs a human.
  grace_days: 1

# Weekend and holiday calendar. Friday orders landing Tuesday is the canonical
# timing defect, and it only happens if weekends are modelled.
calendar:
  weekend_days: [saturday, sunday]

  # Bank holidays, ISO dates. An empty list is not neutral: it makes the engine treat
  # Diwali as a working day, so a payout that was never going to arrive gets counted
  # late and a merchant is told to chase money the bank is closed for.
  #
  # WHAT THESE ARE. The fixed-date national holidays on which Indian banks are shut
  # under the Negotiable Instruments Act, plus the two market holidays the settlement
  # cycle actually turns on. Fixed-date only, deliberately:
  #
  #   Republic Day    26 January
  #   Independence Day 15 August
  #   Gandhi Jayanti   2 October
  #   Christmas       25 December
  #
  # WHAT IS MISSING, AND WHY THAT IS THE HONEST CHOICE. Most Indian bank holidays are
  # lunar or state-declared: Diwali, Holi, Eid, Good Friday and the RBI's own annual
  # closings move every year and differ by state, and Maharashtra's list — the one that
  # governs settlement, since the clearing houses sit there — is published annually
  # rather than derivable. Guessing them would produce a calendar that is confidently
  # wrong on the dates that matter most, which is worse than one that is knowably
  # incomplete: a missing holiday makes one settlement look a day late, while a WRONG
  # holiday makes a real delay look benign, and this engine's whole argument is that
  # it does not quietly explain away money.
  #
  # So: fixed dates are listed, moving feasts are not, and a merchant running a real
  # batch across Diwali should paste that year's RBI list here. That is a config edit,
  # not a code change, which is the point of this file.
  holidays:
    # 2025
    - "2025-01-26"   # Republic Day
    - "2025-08-15"   # Independence Day
    - "2025-10-02"   # Gandhi Jayanti
    - "2025-12-25"   # Christmas
    # 2026
    - "2026-01-26"   # Republic Day
    - "2026-08-15"   # Independence Day
    - "2026-10-02"   # Gandhi Jayanti
    - "2026-12-25"   # Christmas

# Amount matching. Money is integer paise, so exact equality is achievable and is
# the default. A non-zero tolerance here is a deliberate loosening, not a fudge.
amount:
  # Rounding differences we will absorb without flagging. One paise covers
  # half-paise rounding in percentage arithmetic.
  rounding_paise: 1
  # Above this, an unexplained difference is material enough to surface even if it
  # is a small fraction of the batch.
  material_paise: 10000          # ₹100

# Materiality — benign vs actionable. Not a rupee threshold alone: a ₹31,000 timing
# lag that resolves on Tuesday is benign; ₹3,800 of dead subscriptions is not.
# Recoverability decides, size only orders the list. See docs/BEHAVIOR.md, stage `rank`.
#
# The test is "does a human need to DO something this week?", not "is this a
# discrepancy?". Everything on this screen is a discrepancy; only some are actions.
materiality:
  # Never needs a human, however large. These resolve themselves or are correct-by-contract.
  always_benign:
    # The fee ITSELF, which is the contracted cost of taking payments. The part of a
    # fee charged ABOVE the rate card is a different question and is not covered by
    # this entry — it is carried as a note on the fee line and judged by
    # `actionable_above_paise`, because an overcharge is money a merchant can dispute.
    - FEE                     # correct fee, verified against the rate card
    - TAX_ON_FEE              # GST on that fee
    - TIMING                  # arrives on its own, no action possible
    - ROUNDING                # sub-rupee noise
    - REFUND                  # a bookkeeping divergence to reconcile, not a this-week action
    - DUPLICATE               # a data-entry issue in the merchant's own ledger

  # Always needs a human, however small. Money that will not arrive unless someone acts.
  always_actionable:
    - HALTED_SUBSCRIPTION     # recoverable revenue, dying silently
    - MISSING                 # no record at Razorpay at all
    - PAYMENT_FAILED          # some are worth retrying
    - NEEDS_REVIEW            # we refused to guess; a human must
    - UNEXPLAINED             # the honest residual deserves a look
    - UNEXPECTED_SETTLEMENT   # money in for an order that is not in the books

  # Anything not listed above falls through to this cutoff.
  actionable_above_paise: 10000  # ₹100
