# Rate card — what the merchant's contract says Razorpay should charge.
#
# THIS FILE IS THE POINT OF THE CONFIG LAYER.
#
# A hardcoded 2% fee will pass the demo and be wrong for most Indian merchants,
# and so will a hardcoded 0% for UPI. Two DIFFERENT charges are in play and this
# file must not conflate them:
#
#   MDR          — the interchange the network/bank levies. Zero on bank-to-bank
#                  UPI and RuPay debit, mandated by Section 10A of the Payment
#                  and Settlement Systems Act 2007 (in force since Jan 2020).
#   Platform fee — what the AGGREGATOR charges for the rails. Razorpay bills ~2%
#                  on UPI regardless of the zero MDR, and it is this number that
#                  lands in the `fee` field of a settlement.
#
# Zero MDR does not mean a zero fee. A merchant reconciling real UPI rows sees
# ~2% + 18% GST deducted. Expecting 0 would flag every single UPI row as a fee
# discrepancy. See ADR-030.
#
# There is deliberately NO DEFAULT MDR. An unknown payment method raises rather
# than silently assuming 2%. See docs/BEHAVIOR.md, stage `config`.
#
# Distinguish two different questions, which this file answers only the first of:
#   1. "Was the fee what my contract says?"  <- this file, the expected rate
#   2. "How is the fee encoded in the data?" <- ADR-007, derived from the data
# A rate card cannot answer question 2 and must not be used to guess at it.

name: "standard-india-2026"
description: "Razorpay standard pricing for a domestic Indian merchant."
currency: INR

# GST on the MDR — not on the transaction amount.
# On a ₹10,000 card txn: MDR ₹200, GST on that MDR ₹36, net ₹9,764.
gst:
  rate_bps: 1800          # 18.00%, in basis points
  applies_to: mdr         # never `amount` — this is the most common way to get it wrong

# Rounding policy, applied at each step independently.
# MDR is rounded to whole paise first, then GST is computed on the ROUNDED MDR.
# Rationale: it is the common convention, and it keeps the two fee lines
# independently checkable by a merchant — they can verify MDR without having to
# reproduce our GST arithmetic. See ADR-009.
rounding:
  mode: half_up           # half_up | half_even | floor | ceil
  gst_on_rounded_mdr: true

# Per-method rates in basis points. 1 bps = 0.01%.
# Basis points keep everything integer: no float rate ever multiplies a money value.
#
# `mdr_bps` is the CHARGE THE MERCHANT ACTUALLY PAYS — network MDR plus aggregator
# platform fee, which is what appears as `fee` on a settlement row. Where the two
# components differ interestingly, `mdr_component_bps` records the split for
# explanation only; it never enters the arithmetic.
methods:
  upi:
    mdr_bps: 200          # 2.00% — platform fee. NOT MDR.
    mdr_component_bps: 0
    note: >-
      Zero MDR is real (statutory, Section 10A PSSA) but is NOT the merchant's
      cost. Razorpay levies a ~2% platform/technology fee on bank-to-bank UPI,
      and that is what is deducted. Do not "correct" this back to 0. See ADR-030.
  upi_rupay_credit:
    mdr_bps: 215          # 2.15%
    note: >-
      A RuPay credit card paid through a UPI app: a credit card transaction
      wearing a UPI mask. Razorpay prices it at 2.15% + GST, not the standard
      UPI rate, though the payment method may still be reported as `upi`.
      See docs/LIMITATIONS.md — we cannot always tell the two apart.
  card_debit:
    mdr_bps: 200          # 2.00%
    mdr_component_bps: 90
    note: >-
      RuPay debit is statutorily zero-MDR like UPI, but the same platform fee
      applies; Razorpay's published card rate is a flat 2%.
  card_credit:
    mdr_bps: 200          # 2.00%
  card_international:
    mdr_bps: 300          # 3.00%
    note: "Higher rate; forex conversion is a separate line and is out of scope."
  netbanking:
    mdr_bps: 200
  wallet:
    mdr_bps: 200
  emi:
    mdr_bps: 300

# Fixed per-transaction fees, in paise. Zero for standard Indian pricing, but the
# field exists because some contracts are flat-fee and a missing field would force
# a code change rather than a config change.
fixed_fee_paise: 0
