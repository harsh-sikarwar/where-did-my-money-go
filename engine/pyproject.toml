[project]
name = "finctl"
version = "0.1.0"
description = "Where did my money go? — settlement reconciliation with payment-failure correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Razorpay's dashboard exports are .xlsx, not CSV — a merchant downloading their
    # own settlement report gets an Excel file. Reading it is table stakes for the
    # upload path, so this is a core dependency, not an extra. See ADR-043.
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
finctl = "finctl.cli:app"

[project.optional-dependencies]
# Kept separate so the engine can be installed and run with zero web/LLM deps.
# This is deliberate: the Day-1 checkpoint must not depend on FastAPI or an API key.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.20"]
llm = ["anthropic>=0.40", "python-dotenv>=1.0"]
live = ["httpx>=0.28", "python-dotenv>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    # For fastapi.testclient, which drives the upload endpoint tests through the real
    # ASGI app rather than by calling the handler function directly.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "RUF001",  # ambiguous unicode: we intentionally use ₹ and · in output
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request parameters as call expressions in argument defaults —
# `File(...)`, `Form(...)`, `Depends(...)`. That is the framework's documented idiom,
# not the mutable-default bug B008 exists to catch, and there is no way to express an
# upload endpoint without it.
"../api/*.py" = ["B008"]
"**/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
