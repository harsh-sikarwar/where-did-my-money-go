[project]
name = "finctl"
version = "0.1.0"
description = "Where did my money go? — settlement reconciliation with payment-failure correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
finctl = "finctl.cli:app"

[project.optional-dependencies]
# Kept separate so the engine can be installed and run with zero web/LLM deps.
# This is deliberate: the Day-1 checkpoint must not depend on FastAPI or an API key.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.20"]
llm = ["anthropic>=0.40", "python-dotenv>=1.0"]
live = ["httpx>=0.28", "python-dotenv>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "RUF001",  # ambiguous unicode: we intentionally use ₹ and · in output
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
